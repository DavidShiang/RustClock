name: Rust CI & Release

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*' # 当推送形如 v1.0.0 的标签时触发发布
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: clock
            asset_name: RustClock-linux-amd64
          - os: windows-latest
            artifact_name: clock.exe
            asset_name: RustClock-windows-amd64.exe
          - os: macos-latest
            artifact_name: clock
            asset_name: RustClock-macOS-universal

    permissions:
      contents: write # 赋予创建 Release 和上传文件的写权限

    steps:
    - uses: actions/checkout@v4

    # ========== ✨ 核心修复：如果是 Linux 环境，必须安装图形底层依赖，彻底解决 glib-sys 报错 ==========
    - name: Install Linux Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libglib2.0-dev libgtk-3-dev libgtk-4-dev libx11-dev libxext-dev libxft-dev libxinerama-dev libxcursor-dev libxrender-dev libfixposix-dev libxrandr-dev libpango1.0-dev libatk1.0-dev libgdk-pixbuf2.0-dev alsa-utils libasound2-dev 
    # ==========================================================================================

    # 1. 安装 Rust 工具链
    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    # 2. 启用智能缓存，加速编译
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.os }}-cargo

    # 3. 运行测试
    - name: Run Tests
      run: cargo test --verbose

    # 4. 编译 Release 版本
    - name: Build Release
      run: cargo build --release --verbose

    # 5. 重命名二进制文件（收集编译成果）
    - name: Rename Artifact
      shell: bash
      run: |
        mkdir -p dist
        # 考虑到不同 GUI 框架生成的包名可能大小写不同，请确保 target/release/ 下的文件名正确
        if [ -f "target/release/${{ matrix.artifact_name }}" ]; then
          cp "target/release/${{ matrix.artifact_name }}" "dist/${{ matrix.asset_name }}"
        elif [ -f "target/release/rustclock" ]; then
          cp "target/release/rustclock" "dist/${{ matrix.asset_name }}"
        elif [ -f "target/release/rustclock.exe" ]; then
          cp "target/release/rustclock.exe" "dist/${{ matrix.asset_name }}"
        else
          # 保底方案：如果实在找不到，尝试拷贝 target/release 下最新的可执行文件
          find target/release -maxdepth 1 -type f -executable -exec cp {} dist/${{ matrix.asset_name }} \; 2>/dev/null || true
        fi

    # 6. 自动发布到 GitHub Release（只有推送 v* 标签时才会真正执行上传）
    - name: Update GitHub Release
      if: startsWith(github.ref, 'refs/tags/v') && success()
      uses: softprops/action-gh-release@v2
      with:
        files: dist/${{ matrix.asset_name }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
